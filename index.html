<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Minimalist, modern analog saat. Dinamik arka plan renkleri ve koyu mod destegi." />
  <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="Analog Saat — Modern" />
  <meta property="og:description" content="Minimalist, modern analog saat." />
  <meta property="og:type" content="website" />
  <title>Analog Saat — Modern</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F554;</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg-1:#eef2f7;
      --bg-2:#e6ecf5;
      --face:#ffffff;
      --ring:#f1f5f9;
      --tick:#cbd5e1;
      --text:#0f172a;
      --accent:#ef4444; /* saniye kolu */
      --hand-hour:#3b3b3b;
      --hand-minute:#4b5563;
      --shadow:0 18px 45px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.10);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg-1:#0b1220;
        --bg-2:#0f172a;
        --face:#0f172a;
        --ring:#0b1220;
        --tick:#334155;
        --text:#e2e8f0;
        --accent:#fb7185;
        --hand-hour:#cbd5e1;
        --hand-minute:#94a3b8;
        --shadow:0 18px 45px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.45);
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      display:grid;
      place-items:center;
      font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background: radial-gradient(60% 60% at 50% 25%, var(--bg-1), var(--bg-2));
      transition: background 600ms ease;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    .clock{
      position:relative;
      width:min(90vmin, 520px);
      aspect-ratio:1/1;
      border-radius:50%;
      background:var(--face);
      box-shadow:var(--shadow);
      isolation:isolate;
      transition:transform 300ms ease;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .clock:hover{ transform:scale(1.02); }
    /* Çift halka — ince premium görünüm */
    .clock::before, .clock::after{
      content:"";
      position:absolute; inset:14px;
      border-radius:50%;
      background:conic-gradient(from 0deg, #0000, #0001 8%, #0000 33%), radial-gradient(closest-side, #00000008, #0000 70%);
      mix-blend-mode:multiply;
    }
    .clock::after{ inset:28px; background:radial-gradient(closest-side, var(--ring), #0000 75%); opacity:.85 }

    /* Rakamlar ve çizgiler için ortak başlangıç noktası */
    .layer{ position:absolute; inset:0; }

    .number{
      position:absolute;
      width:48px; height:48px;
      display:grid; place-items:center;
      color:var(--text);
      font-weight:600; font-size:clamp(14px, 2.4vmin, 22px);
      transform:translate(-50%, -50%);
      pointer-events:none;
      text-shadow:0 1px 0 rgba(255,255,255,.2);
    }

    .tick{ position:absolute; width:3px; height:16px; background:var(--tick); border-radius:2px; transform-origin:50% 50%; opacity:.95 }
    .tick.hour{ height:26px; width:4px; background:var(--text); opacity:.9 }

    /* Kollar */
    .hand{ position:absolute; left:50%; top:50%; transform:translate(-50%, -100%) rotate(0deg); transform-origin:50% 100%; }
    .hand.hour{ width:10px; height:30%; background:linear-gradient(#0000 0 10%, var(--hand-hour) 10% 100%); border-radius:10px; filter:drop-shadow(0 2px 1px rgba(0,0,0,.15)); transition:background 300ms; }
    .hand.minute{ width:8px; height:40%; background:linear-gradient(#0000 0 8%, var(--hand-minute) 8% 100%); border-radius:8px; filter:drop-shadow(0 2px 1px rgba(0,0,0,.12)); transition:background 300ms; }
    .hand.second{ width:3px; height:45%; background:var(--accent); border-radius:3px; box-shadow:0 0 0 1px #00000010; }

    .cap{
      position:absolute; left:50%; top:50%; translate:-50% -50%;
      width:18px; height:18px; border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #ffffff, #d4d4d4 55%, #8a8a8a);
      box-shadow:0 2px 6px rgba(0,0,0,.25);
      z-index:3;
    }

    /* Cam parıltısı */
    .glass{
      position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(120% 60% at 70% 10%, #ffffff30, #0000 40%), linear-gradient(180deg, #ffffff10, #0000 60%);
      mix-blend-mode:screen; pointer-events:none; z-index:4;
    }

    /* Dijital saat yüzü */
    .digital-face{
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:2; pointer-events:none;
      opacity:0; transition:opacity 400ms ease;
    }
    .digital-face.active{ opacity:1; }
    .digital-time{
      font-size:clamp(42px, 10vmin, 80px);
      font-weight:700;
      font-variant-numeric:tabular-nums;
      color:var(--text);
      letter-spacing:.04em;
      line-height:1;
    }
    .digital-seconds{
      font-size:clamp(18px, 4vmin, 32px);
      font-weight:400;
      color:var(--accent);
      margin-top:4px;
    }
    .digital-date{
      font-size:clamp(10px, 1.8vmin, 14px);
      color:var(--text);
      opacity:.5;
      margin-top:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    /* Mod geçişleri: analog parçaları gizle/göster */
    .clock .hand, .clock .cap, .clock .layer{ transition:opacity 400ms ease; }
    .clock.mode-digital .hand,
    .clock.mode-digital .cap{ opacity:0; }
    .clock.mode-minimal .number{ opacity:0; transition:opacity 400ms ease; }

    /* Mod göstergesi */
    .mode-indicator{
      display:flex; gap:8px; align-items:center;
      margin-top:2px;
    }
    .mode-dot{
      width:7px; height:7px;
      border-radius:50%;
      background:var(--text);
      opacity:.2;
      transition:opacity 300ms, transform 300ms;
    }
    .mode-dot.active{
      opacity:.7;
      transform:scale(1.3);
    }

    .info{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }
    .time-display{
      color:var(--text);
      font-size:clamp(18px, 3vmin, 28px);
      font-weight:500;
      font-variant-numeric:tabular-nums;
      letter-spacing:.05em;
      opacity:.85;
    }
    .date-display{
      color:var(--text);
      font-size:clamp(11px, 1.6vmin, 14px);
      opacity:.5;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="clock" aria-label="Analog saat" role="img">
      <div class="layer" id="ticks"></div>
      <div class="layer" id="numbers"></div>

      <div class="hand hour"   id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="cap"></div>

      <div class="digital-face" id="digitalFace">
        <div class="digital-time" id="digitalTime"></div>
        <div class="digital-seconds" id="digitalSeconds"></div>
        <div class="digital-date" id="digitalDate"></div>
      </div>

      <div class="glass"></div>
    </div>
    <div class="info">
      <div class="time-display" id="a11yTime" aria-live="polite"></div>
      <div class="date-display" id="dateDisplay"></div>
      <div class="mode-indicator" id="modeIndicator">
        <div class="mode-dot active" title="Analog"></div>
        <div class="mode-dot" title="Dijital"></div>
        <div class="mode-dot" title="Minimal"></div>
      </div>
    </div>
  </div>

  <script>
    const colors = [
      '#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399',
      '#22d3ee', '#60a5fa', '#818cf8', '#a78bfa', '#c084fc',
      '#e879f9', '#f472b6', '#fb7185', '#f97316', '#eab308',
      '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#6366f1'
    ];

    const clock   = document.querySelector('.clock');
    const ticksEl = document.getElementById('ticks');
    const numsEl  = document.getElementById('numbers');

    const hourHand   = document.getElementById('hour');
    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');
    const a11yTime      = document.getElementById('a11yTime');
    const dateDisplay   = document.getElementById('dateDisplay');
    const digitalFace   = document.getElementById('digitalFace');
    const digitalTime   = document.getElementById('digitalTime');
    const digitalSecs   = document.getElementById('digitalSeconds');
    const digitalDate   = document.getElementById('digitalDate');
    const modeDots      = document.querySelectorAll('.mode-dot');

    // Mod yönetimi: analog → digital → minimal → analog …
    const modes = ['analog', 'digital', 'minimal'];
    let modeIndex = 0;

    clock.addEventListener('click', () => {
      modeIndex = (modeIndex + 1) % modes.length;
      applyMode();
    });

    function applyMode(){
      const mode = modes[modeIndex];
      clock.className = 'clock' + (mode !== 'analog' ? ' mode-' + mode : '');
      digitalFace.classList.toggle('active', mode === 'digital');
      modeDots.forEach((d, i) => d.classList.toggle('active', i === modeIndex));
    }

    // 60 çizgi (her 5.'si kalın saat çizgisi)
    const R_TICK = 46; // yüzde (merkezden)
    for(let i=0;i<60;i++){
      const tick = document.createElement('div');
      tick.className = 'tick' + (i%5===0 ? ' hour' : '');
      const angle = i * 6; // derece
      const rad = angle * Math.PI / 180;
      const x = 50 + R_TICK * Math.sin(rad);
      const y = 50 - R_TICK * Math.cos(rad);
      tick.style.left = x + '%';
      tick.style.top  = y + '%';
      tick.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;
      ticksEl.appendChild(tick);
    }

    // 12 rakam
    const R_NUM = 39;
    for(let i=1;i<=12;i++){
      const n = document.createElement('div');
      n.className = 'number';
      n.textContent = i;
      const angle = i * 30; // derece
      const rad = angle * Math.PI / 180;
      const x = 50 + R_NUM * Math.sin(rad);
      const y = 50 - R_NUM * Math.cos(rad);
      n.style.left = x + '%';
      n.style.top  = y + '%';
      numsEl.appendChild(n);
    }

    // Sürekli akış (sıçrama yok): requestAnimationFrame ile akıcı hareket
    function tick(){
      const now = new Date();
      const ms = now.getMilliseconds();
      const s  = now.getSeconds() + ms/1000;
      const m  = now.getMinutes() + s/60;
      const h  = (now.getHours() % 12) + m/60;

      const sDeg = s * 6;      // 360/60
      const mDeg = m * 6;
      const hDeg = h * 30;     // 360/12

      hourHand.style.transform   = `translate(-50%,-100%) rotate(${hDeg}deg)`;
      minuteHand.style.transform = `translate(-50%,-100%) rotate(${mDeg}deg)`;
      secondHand.style.transform = `translate(-50%,-100%) rotate(${sDeg}deg)`;

      // Dijital saat ve tarih
      const timeStr = now.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      const dateStr = now.toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      a11yTime.textContent = timeStr;
      dateDisplay.textContent = dateStr;

      // Dijital yüz
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const ss = String(now.getSeconds()).padStart(2,'0');
      digitalTime.textContent = hh + ':' + mm;
      digitalSecs.textContent = ss;
      digitalDate.textContent = dateStr;

      // Arka plan: dakika bazlı yumuşak geçiş (iki komşu rengi harmanla)
      const cIndex = Math.floor(m) % colors.length;
      const nextIndex = (cIndex + 1) % colors.length;
      const t = (s % 60) / 60; // 0..1
      const c1 = colors[cIndex];
      const c2 = colors[nextIndex];
      document.body.style.background = `radial-gradient(60% 60% at 50% 25%, ${mix(c1,c2,t)}, var(--bg-2))`;

      requestAnimationFrame(tick);
    }

    // HEX renk karıştırma
    function mix(hex1, hex2, t){
      const a = hexToRgb(hex1), b = hexToRgb(hex2);
      const m = {
        r: Math.round(a.r + (b.r - a.r) * t),
        g: Math.round(a.g + (b.g - a.g) * t),
        b: Math.round(a.b + (b.b - a.b) * t),
      };
      return `rgb(${m.r}, ${m.g}, ${m.b})`;
    }
    function hexToRgb(hex){
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : {r:255,g:255,b:255};
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
